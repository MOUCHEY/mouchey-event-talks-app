<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigQuery Release Notes Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar/Header -->
        <header class="app-header">
            <div class="logo-area">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
                        <line x1="4" y1="22" x2="4" y2="15"></line>
                    </svg>
                </div>
                <div>
                    <h1>BigQuery Updates</h1>
                    <p class="subtitle">Release Notes & Insights Feed</p>
                </div>
            </div>
            
            <div class="header-actions">
                <button id="refresh-btn" class="btn btn-primary" title="Refresh Release Notes">
                    <svg id="refresh-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-refresh-cw"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
                    <span>Refresh</span>
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="app-main">
            <!-- Search and Filter Bar -->
            <section class="controls-card">
                <div class="search-box">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" class="search-icon">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="search-input" placeholder="Search keywords, features, or dates...">
                </div>
                
                <div class="filter-chips" id="filter-container">
                    <button class="chip active" data-filter="all">All Updates</button>
                    <button class="chip" data-filter="feature">Features</button>
                    <button class="chip" data-filter="change">Changes</button>
                    <button class="chip" data-filter="issue">Issues</button>
                    <button class="chip" data-filter="announcement">Announcements</button>
                    <button class="chip" data-filter="security">Security</button>
                </div>
            </section>

            <!-- Error Banner -->
            <div id="error-banner" class="error-banner hidden">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span id="error-message">Failed to load release notes. Please try again.</span>
            </div>

            <!-- Feed Section -->
            <section class="feed-container">
                <div id="loading-state" class="loading-state">
                    <div class="spinner"></div>
                    <p>Fetching BigQuery release notes...</p>
                </div>
                
                <div id="empty-state" class="empty-state hidden">
                    <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" /><path d="M12 8v8" /><path d="M8 12h8" /></svg>
                    <h3>No updates found</h3>
                    <p>Try resetting filters or changing your search term.</p>
                </div>

                <div id="feed-list" class="feed-list">
                    <!-- Dynamic updates loaded here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Twitter Preview Modal -->
    <div id="tweet-modal" class="modal hidden">
        <div class="modal-overlay" id="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Share Update on X / Twitter</h2>
                <button class="close-btn" id="close-modal-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="tweet-composer-box">
                    <div class="tweet-avatar">
                        <span>BQ</span>
                    </div>
                    <div class="tweet-textarea-container">
                        <textarea id="tweet-textarea" rows="5" maxlength="280"></textarea>
                        <div class="tweet-char-count-container">
                            <span id="tweet-char-count">0</span> / 280
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancel-tweet-btn">Cancel</button>
                <button class="btn btn-tweet" id="confirm-tweet-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                    </svg>
                    <span>Post Update</span>
                </button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
